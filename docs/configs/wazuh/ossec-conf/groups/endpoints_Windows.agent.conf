<!-- Wazuh group endpoints_Windows: verbatim copy of the manager's shared agent.conf (CT100), no secrets. Reference only; Jacob applies changes on the manager. -->
<agent_config>
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>
  </syscheck>
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>no</scan_on_start>
    <interval>7d</interval>
  </sca>
  <localfile>
    <location>Application</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[Level&lt;=3 or EventID=1033 or EventID=1034]</query>
  </localfile>
</agent_config>
